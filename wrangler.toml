name = "dump"
main = "worker/src/index.ts"
compatibility_date = "2026-10-24"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dump-db"
database_id = "f727a285-ca76-4a99-bf5c-88cdeb03b25f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "FILES"
id = "819ac3dcec264ed88d9d062f4900f15b"

[triggers]
crons = ["0 21 * * *"] # daily 21:00 UTC = 03:00 Asia/Dhaka

[observability]
enabled = true
